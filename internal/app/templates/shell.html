{{define "shell-start"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (_) {}
    })();
  </script>
  <script>
    window.forgeAuth = (() => {
      let resolveInitialized;
      const initialized = new Promise((resolve) => {
        resolveInitialized = resolve;
      });
      const state = { initialized, ready: false, token: "", user: null };

      const requestPath = (event) => {
        const rawPath = event.detail.path || event.detail.requestConfig?.path || "";
        try {
          return new URL(rawPath, window.location.origin).pathname;
        } catch (_) {
          return "";
        }
      };

      const requiresAuth = (event) => {
        if (event.detail.elt?.closest?.("[data-require-auth]")) return true;
        const path = requestPath(event);
        return path === "/ui" ||
          path === "/ui/" ||
          path.startsWith("/ui/workouts") ||
          path === "/workouts" ||
          path.startsWith("/workouts/") ||
          path === "/workout-sessions" ||
          path.startsWith("/workout-sessions/");
      };

      const redirectToLogin = () => {
        if (window.location.pathname === "/ui/login") return;
        const next = `${window.location.pathname}${window.location.search}`;
        window.location.assign(`/ui/login?next=${encodeURIComponent(next)}`);
      };

      document.addEventListener("htmx:confirm", (event) => {
        if (!requiresAuth(event)) return;

        if (!state.ready) {
          event.preventDefault();
          state.initialized.then(() => {
            if (state.token) {
              event.detail.issueRequest();
            } else {
              redirectToLogin();
            }
          });
          return;
        }

        if (!state.token) {
          event.preventDefault();
          redirectToLogin();
        }
      });

      document.addEventListener("htmx:configRequest", (event) => {
        if (state.token) {
          event.detail.headers.Authorization = `Bearer ${state.token}`;
        }
      });

      return {
        state,
        update(user, token) {
          state.user = user;
          state.token = token || "";
          if (!state.ready) {
            state.ready = true;
            resolveInitialized();
          }
          document.dispatchEvent(new CustomEvent("forge:auth-change", { detail: { user } }));
        },
        redirectToLogin,
      };
    })();
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --surface: #ffffff;
      --surface-soft: #f1f1ed;
      --text: #171717;
      --muted: #70706a;
      --line: #e3e3dc;
      --line-strong: #c9c9bf;
      --accent: #2563eb;
      --accent-soft: #eef4ff;
      --chip-text: #4d4d48;
      --instruction-text: #343430;
      --shadow: 0 18px 45px rgba(23, 23, 23, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101112;
        --surface: #181a1d;
        --surface-soft: #22252a;
        --text: #f3f1ea;
        --muted: #a7a39a;
        --line: #2f3338;
        --line-strong: #4a5058;
        --accent: #8ab4ff;
        --accent-soft: rgba(138, 180, 255, 0.14);
        --chip-text: #d8d3c8;
        --instruction-text: #ece8df;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
      }
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f7f7f4;
      --surface: #ffffff;
      --surface-soft: #f1f1ed;
      --text: #171717;
      --muted: #70706a;
      --line: #e3e3dc;
      --line-strong: #c9c9bf;
      --accent: #2563eb;
      --accent-soft: #eef4ff;
      --chip-text: #4d4d48;
      --instruction-text: #343430;
      --shadow: 0 18px 45px rgba(23, 23, 23, 0.06);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #101112;
      --surface: #181a1d;
      --surface-soft: #22252a;
      --text: #f3f1ea;
      --muted: #a7a39a;
      --line: #2f3338;
      --line-strong: #4a5058;
      --accent: #8ab4ff;
      --accent-soft: rgba(138, 180, 255, 0.14);
      --chip-text: #d8d3c8;
      --instruction-text: #ece8df;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--text); color: var(--surface); font-size: 0.78rem; letter-spacing: -0.04em; }
    .nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
    .nav a, .button, button { border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--text); cursor: pointer; font: inherit; font-weight: 650; padding: 9px 14px; transition: background 120ms ease, border-color 120ms ease, color 120ms ease; }
    .nav a:hover, .button:hover, button:hover { background: var(--surface-soft); }
    .nav a.active, .button.primary { background: var(--text); color: var(--surface); }
    .theme-toggle { min-width: 68px; }
    .auth-user { align-self: center; color: var(--muted); font-size: 0.82rem; max-width: 180px; overflow: hidden; padding: 0 8px; text-overflow: ellipsis; white-space: nowrap; }
    main { padding: 26px 0 64px; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: stretch; }
    .panel, .card, .stat, .detail { border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
    .panel { border-radius: 28px; padding: clamp(24px, 4vw, 42px); }
    .eyebrow { color: var(--accent); font-size: 0.78rem; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 12px 0; max-width: 720px; font-size: clamp(2.3rem, 5vw, 4.8rem); line-height: 0.98; letter-spacing: -0.07em; }
    h2 { margin: 0; font-size: clamp(1.35rem, 2vw, 1.8rem); letter-spacing: -0.04em; }
    h3 { margin: 0; font-size: 1.02rem; letter-spacing: -0.02em; }
    p { color: var(--muted); line-height: 1.6; }
    .stack { display: grid; gap: 14px; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .stat { border-radius: 22px; padding: 18px; }
    .stat strong { display: block; margin-top: 6px; font-size: 2rem; letter-spacing: -0.06em; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { border-radius: 20px; padding: 18px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; transition: border-color 120ms ease, transform 120ms ease; }
    .card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; background: var(--surface-soft); color: var(--chip-text); font-size: 0.8rem; padding: 6px 10px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 24px 0 16px; }
    .search { display: flex; gap: 10px; width: min(620px, 100%); }
    input { width: 100%; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); font: inherit; padding: 12px 15px; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .detail { border-radius: 28px; padding: clamp(22px, 4vw, 40px); }
    .instructions { counter-reset: step; display: grid; gap: 12px; padding: 0; list-style: none; }
    .instructions li { counter-increment: step; border: 1px solid var(--line); background: var(--surface-soft); border-radius: 14px; padding: 14px 16px; color: var(--instruction-text); }
    .instructions li:before { content: counter(step, decimal-leading-zero); color: var(--accent); font-weight: 800; margin-right: 10px; }
    .empty { border: 1px dashed var(--line); border-radius: 20px; color: var(--muted); padding: 28px; text-align: center; }
    .back { display: inline-flex; margin-bottom: 18px; color: var(--accent); font-weight: 650; }
    .auth-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr); gap: 18px; align-items: stretch; }
    .auth-intro { display: flex; flex-direction: column; justify-content: center; min-height: 470px; }
    .auth-card { display: grid; align-content: center; gap: 22px; }
    .auth-form { display: grid; gap: 14px; }
    .auth-form label { display: grid; gap: 7px; color: var(--muted); font-size: 0.84rem; font-weight: 700; }
    .auth-form input { border-radius: 14px; }
    .auth-form .button, .auth-google { border-radius: 14px; justify-content: center; width: 100%; }
    .auth-divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.8rem; }
    .auth-divider:before, .auth-divider:after { content: ""; height: 1px; background: var(--line); flex: 1; }
    .auth-google { border-color: var(--line); }
    .auth-error { border: 1px solid #dc2626; border-radius: 14px; color: #dc2626; margin: 0; padding: 12px 14px; }
    .auth-loading { min-height: 320px; display: grid; place-items: center; text-align: center; }
    [hidden] { display: none !important; }
    .htmx-indicator { opacity: 0; transition: opacity 120ms ease; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }

    @media (max-width: 820px) {
      .topbar, .toolbar { align-items: flex-start; flex-direction: column; }
      .hero, .grid, .stats, .auth-layout { grid-template-columns: 1fr; }
      .shell { width: min(100% - 22px, 1120px); }
      .panel { border-radius: 24px; }
      .auth-intro { min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/ui/">
        <span class="mark">FF</span>
        <span>Forge Fitness</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="/ui/" data-nav-section="home" {{if eq .Active "home"}}class="active"{{end}}>Dashboard</a>
        <a href="/ui/workouts" data-require-auth data-nav-section="workouts" {{if eq .Active "workouts"}}class="active"{{end}}>Workouts</a>
        <a href="/ui/exercises" data-nav-section="exercises" {{if eq .Active "exercises"}}class="active"{{end}}>Exercises</a>
        <span class="auth-user" data-auth-user data-auth-signed-in hidden></span>
        <a href="/ui/login" data-auth-signed-out hidden>Sign in</a>
        <button type="button" data-auth-logout data-auth-signed-in hidden>Sign out</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">Theme</button>
      </nav>
    </header>
    <main id="main" hx-boost="true" hx-target="#main" hx-swap="innerHTML show:window:top">
{{end}}

{{define "shell-end"}}
    </main>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      onIdTokenChanged,
      signInWithEmailAndPassword,
      signInWithPopup,
      signOut,
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

    const authError = document.querySelector("[data-auth-error]");
    const setAuthError = (message) => {
      if (!authError) return;
      authError.textContent = message;
      authError.hidden = !message;
    };

    const errorMessage = (error) => {
      switch (error?.code) {
        case "auth/invalid-credential":
        case "auth/user-not-found":
        case "auth/wrong-password":
          return "Email or password is incorrect.";
        case "auth/invalid-email":
          return "Enter a valid email address.";
        case "auth/popup-closed-by-user":
          return "Google sign-in was canceled.";
        case "auth/too-many-requests":
          return "Too many attempts. Try again later.";
        default:
          return "Sign-in failed. Try again.";
      }
    };

    const destination = () => {
      const next = new URLSearchParams(window.location.search).get("next");
      return next?.startsWith("/") && !next.startsWith("//") ? next : "/ui/";
    };

    const syncAuthControls = (user) => {
      document.querySelectorAll("[data-auth-signed-in]").forEach((element) => {
        element.hidden = !user;
      });
      document.querySelectorAll("[data-auth-signed-out]").forEach((element) => {
        element.hidden = Boolean(user);
      });
      document.querySelectorAll("[data-auth-user]").forEach((element) => {
        element.textContent = user?.displayName || user?.email || "Signed in";
      });
    };

    try {
      const response = await fetch("/ui/auth-config", { headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error("Firebase web configuration unavailable");

      const authConfig = await response.json();
      const firebaseApp = initializeApp(authConfig.firebase);
      const firebaseAuth = getAuth(firebaseApp);
      const googleProvider = new GoogleAuthProvider();

      onIdTokenChanged(firebaseAuth, async (user) => {
        try {
          const token = user ? await user.getIdToken() : "";
          window.forgeAuth.update(user, token);
          syncAuthControls(user);

          if (user && window.location.pathname === "/ui/login") {
            window.location.assign(destination());
          }
        } catch (error) {
          console.error(error);
          window.forgeAuth.update(null, "");
          syncAuthControls(null);
          setAuthError("Unable to verify your sign-in. Try again.");
        }
      });

      document.querySelector("[data-auth-login-form]")?.addEventListener("submit", async (event) => {
        event.preventDefault();
        setAuthError("");
        const submit = event.currentTarget.querySelector("[data-auth-email-submit]");
        submit.disabled = true;

        try {
          const form = new FormData(event.currentTarget);
          await signInWithEmailAndPassword(firebaseAuth, String(form.get("email")), String(form.get("password")));
        } catch (error) {
          setAuthError(errorMessage(error));
          submit.disabled = false;
        }
      });

      document.querySelector("[data-auth-google]")?.addEventListener("click", async (event) => {
        setAuthError("");
        event.currentTarget.disabled = true;
        try {
          await signInWithPopup(firebaseAuth, googleProvider);
        } catch (error) {
          setAuthError(errorMessage(error));
          event.currentTarget.disabled = false;
        }
      });

      document.querySelector("[data-auth-logout]")?.addEventListener("click", async () => {
        await signOut(firebaseAuth);
        window.location.assign("/ui/login");
      });

      document.addEventListener("htmx:responseError", async (event) => {
        if (event.detail.xhr.status !== 401) return;
        await signOut(firebaseAuth);
        window.forgeAuth.redirectToLogin();
      });
    } catch (error) {
      console.error(error);
      window.forgeAuth.update(null, "");
      syncAuthControls(null);
      setAuthError("Authentication is unavailable. Check server configuration.");
    }
  </script>
  <script>
    (() => {
      const button = document.querySelector("[data-theme-toggle]");
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const navLinks = Array.from(document.querySelectorAll("[data-nav-section]"));

      const syncNav = () => {
        const path = window.location.pathname;
        let section = "home";
        if (path.startsWith("/ui/login")) section = "login";
        if (path.startsWith("/ui/exercises")) section = "exercises";
        if (path.startsWith("/ui/workouts")) section = "workouts";

        navLinks.forEach((link) => {
          link.classList.toggle("active", link.dataset.navSection === section);
        });
      };

      const storedTheme = () => {
        try {
          const theme = localStorage.getItem("theme");
          return theme === "light" || theme === "dark" ? theme : "";
        } catch (_) {
          return "";
        }
      };

      const currentTheme = () => storedTheme() || (media.matches ? "dark" : "light");

      const syncButton = () => {
        if (!button) return;
        const theme = currentTheme();
        const nextTheme = theme === "dark" ? "light" : "dark";
        button.textContent = nextTheme === "dark" ? "Dark" : "Light";
        button.setAttribute("aria-label", `Switch to ${nextTheme} mode`);
        button.setAttribute("aria-pressed", String(theme === "dark"));
      };

      button?.addEventListener("click", () => {
        const nextTheme = currentTheme() === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        try {
          localStorage.setItem("theme", nextTheme);
        } catch (_) {}
        syncButton();
      });

      media.addEventListener("change", () => {
        if (!storedTheme()) syncButton();
      });

      document.body.addEventListener("htmx:afterSettle", syncNav);
      window.addEventListener("popstate", syncNav);

      syncButton();
      syncNav();
    })();
  </script>
</body>
</html>
{{end}}

{{define "auth-loading"}}
<section
  class="panel auth-loading"
  data-require-auth
  hx-get="{{.AuthPath}}"
  hx-trigger="load"
  hx-target="this"
  hx-swap="outerHTML"
>
  <div>
    <div class="eyebrow">Authenticating</div>
    <h2>Loading your training data...</h2>
  </div>
</section>
{{end}}
