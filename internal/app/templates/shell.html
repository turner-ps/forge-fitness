{{define "shell-start"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (_) {}
    })();
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --surface: #ffffff;
      --surface-soft: #f1f1ed;
      --text: #171717;
      --muted: #70706a;
      --line: #e3e3dc;
      --line-strong: #c9c9bf;
      --accent: #2563eb;
      --accent-soft: #eef4ff;
      --chip-text: #4d4d48;
      --instruction-text: #343430;
      --shadow: 0 18px 45px rgba(23, 23, 23, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101112;
        --surface: #181a1d;
        --surface-soft: #22252a;
        --text: #f3f1ea;
        --muted: #a7a39a;
        --line: #2f3338;
        --line-strong: #4a5058;
        --accent: #8ab4ff;
        --accent-soft: rgba(138, 180, 255, 0.14);
        --chip-text: #d8d3c8;
        --instruction-text: #ece8df;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
      }
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f7f7f4;
      --surface: #ffffff;
      --surface-soft: #f1f1ed;
      --text: #171717;
      --muted: #70706a;
      --line: #e3e3dc;
      --line-strong: #c9c9bf;
      --accent: #2563eb;
      --accent-soft: #eef4ff;
      --chip-text: #4d4d48;
      --instruction-text: #343430;
      --shadow: 0 18px 45px rgba(23, 23, 23, 0.06);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #101112;
      --surface: #181a1d;
      --surface-soft: #22252a;
      --text: #f3f1ea;
      --muted: #a7a39a;
      --line: #2f3338;
      --line-strong: #4a5058;
      --accent: #8ab4ff;
      --accent-soft: rgba(138, 180, 255, 0.14);
      --chip-text: #d8d3c8;
      --instruction-text: #ece8df;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--text); color: var(--surface); font-size: 0.78rem; letter-spacing: -0.04em; }
    .nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
    .nav a, .button, button { border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--text); cursor: pointer; font: inherit; font-weight: 650; padding: 9px 14px; transition: background 120ms ease, border-color 120ms ease, color 120ms ease; }
    .nav a:hover, .button:hover, button:hover { background: var(--surface-soft); }
    .nav a.active, .button.primary { background: var(--text); color: var(--surface); }
    .theme-toggle { min-width: 68px; }
    main { padding: 26px 0 64px; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: stretch; }
    .panel, .card, .stat, .detail { border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
    .panel { border-radius: 28px; padding: clamp(24px, 4vw, 42px); }
    .eyebrow { color: var(--accent); font-size: 0.78rem; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 12px 0; max-width: 720px; font-size: clamp(2.3rem, 5vw, 4.8rem); line-height: 0.98; letter-spacing: -0.07em; }
    h2 { margin: 0; font-size: clamp(1.35rem, 2vw, 1.8rem); letter-spacing: -0.04em; }
    h3 { margin: 0; font-size: 1.02rem; letter-spacing: -0.02em; }
    p { color: var(--muted); line-height: 1.6; }
    .stack { display: grid; gap: 14px; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .stat { border-radius: 22px; padding: 18px; }
    .stat strong { display: block; margin-top: 6px; font-size: 2rem; letter-spacing: -0.06em; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { border-radius: 20px; padding: 18px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; transition: border-color 120ms ease, transform 120ms ease; }
    .card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; background: var(--surface-soft); color: var(--chip-text); font-size: 0.8rem; padding: 6px 10px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 24px 0 16px; }
    .search { display: flex; gap: 10px; width: min(620px, 100%); }
    input { width: 100%; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); font: inherit; padding: 12px 15px; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .detail { border-radius: 28px; padding: clamp(22px, 4vw, 40px); }
    .instructions { counter-reset: step; display: grid; gap: 12px; padding: 0; list-style: none; }
    .instructions li { counter-increment: step; border: 1px solid var(--line); background: var(--surface-soft); border-radius: 14px; padding: 14px 16px; color: var(--instruction-text); }
    .instructions li:before { content: counter(step, decimal-leading-zero); color: var(--accent); font-weight: 800; margin-right: 10px; }
    .empty { border: 1px dashed var(--line); border-radius: 20px; color: var(--muted); padding: 28px; text-align: center; }
    .back { display: inline-flex; margin-bottom: 18px; color: var(--accent); font-weight: 650; }
    .htmx-indicator { opacity: 0; transition: opacity 120ms ease; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }

    @media (max-width: 820px) {
      .topbar, .toolbar { align-items: flex-start; flex-direction: column; }
      .hero, .grid, .stats { grid-template-columns: 1fr; }
      .shell { width: min(100% - 22px, 1120px); }
      .panel { border-radius: 24px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/ui/">
        <span class="mark">FF</span>
        <span>Forge Fitness</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="/ui/" data-nav-section="home" {{if eq .Active "home"}}class="active"{{end}}>Dashboard</a>
        <a href="/ui/workouts" data-nav-section="workouts" {{if eq .Active "workouts"}}class="active"{{end}}>Workouts</a>
        <a href="/ui/exercises" data-nav-section="exercises" {{if eq .Active "exercises"}}class="active"{{end}}>Exercises</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">Theme</button>
      </nav>
    </header>
    <main id="main" hx-boost="true" hx-target="#main" hx-swap="innerHTML show:window:top">
{{end}}

{{define "shell-end"}}
    </main>
  </div>
  <script>
    (() => {
      const button = document.querySelector("[data-theme-toggle]");
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const navLinks = Array.from(document.querySelectorAll("[data-nav-section]"));

      const syncNav = () => {
        const path = window.location.pathname;
        const section = path.startsWith("/ui/exercises")
          ? "exercises"
          : path.startsWith("/ui/workouts")
            ? "workouts"
            : "home";

        navLinks.forEach((link) => {
          link.classList.toggle("active", link.dataset.navSection === section);
        });
      };

      const storedTheme = () => {
        try {
          const theme = localStorage.getItem("theme");
          return theme === "light" || theme === "dark" ? theme : "";
        } catch (_) {
          return "";
        }
      };

      const currentTheme = () => storedTheme() || (media.matches ? "dark" : "light");

      const syncButton = () => {
        if (!button) return;
        const theme = currentTheme();
        const nextTheme = theme === "dark" ? "light" : "dark";
        button.textContent = nextTheme === "dark" ? "Dark" : "Light";
        button.setAttribute("aria-label", `Switch to ${nextTheme} mode`);
        button.setAttribute("aria-pressed", String(theme === "dark"));
      };

      button?.addEventListener("click", () => {
        const nextTheme = currentTheme() === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        try {
          localStorage.setItem("theme", nextTheme);
        } catch (_) {}
        syncButton();
      });

      media.addEventListener("change", () => {
        if (!storedTheme()) syncButton();
      });

      document.body.addEventListener("htmx:afterSettle", syncNav);
      window.addEventListener("popstate", syncNav);

      syncButton();
      syncNav();
    })();
  </script>
</body>
</html>
{{end}}
